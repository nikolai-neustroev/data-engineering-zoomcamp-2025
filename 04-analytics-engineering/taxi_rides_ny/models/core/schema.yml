version: 2

models:
  - name: dim_zones
    description: >
      List of unique zones idefied by locationid. 
      Includes the service zone they correspond to (Green or yellow).

  - name: dm_monthly_zone_revenue
    description: >
      Aggregated table of all taxi trips corresponding to both service zones (Green and yellow) per pickup zone, month and service.
      The table contains monthly sums of the fare elements used to calculate the monthly revenue. 
      The table contains also monthly indicators like number of trips, and average trip distance. 
    columns:
      - name: revenue_monthly_total_amount
        description: Monthly sum of the the total_amount of the fare charged for the trip per pickup zone, month and service.
        tests:
            - not_null:
                severity: error
      
  - name: fact_trips
    description: >
      Taxi trips corresponding to both service zones (Green and yellow).
      The table contains records where both pickup and dropoff locations are valid and known zones. 
      Each record corresponds to a trip uniquely identified by tripid. 
    columns:
      - name: tripid
        data_type: string
        description: "unique identifier conformed by the combination of vendorid and pickup time"

      - name: vendorid
        data_type: int64
        description: ""

      - name: service_type
        data_type: string
        description: ""

      - name: ratecodeid
        data_type: int64
        description: ""

      - name: pickup_locationid
        data_type: int64
        description: ""

      - name: pickup_borough
        data_type: string
        description: ""

      - name: pickup_zone
        data_type: string
        description: ""

      - name: dropoff_locationid
        data_type: int64
        description: ""

      - name: dropoff_borough
        data_type: string
        description: ""

      - name: dropoff_zone
        data_type: string
        description: ""

      - name: pickup_datetime
        data_type: timestamp
        description: ""

      - name: dropoff_datetime
        data_type: timestamp
        description: ""

      - name: store_and_fwd_flag
        data_type: string
        description: ""

      - name: passenger_count
        data_type: int64
        description: ""

      - name: trip_distance
        data_type: numeric
        description: ""

      - name: trip_type
        data_type: int64
        description: ""

      - name: fare_amount
        data_type: numeric
        description: ""

      - name: extra
        data_type: numeric
        description: ""

      - name: mta_tax
        data_type: numeric
        description: ""

      - name: tip_amount
        data_type: numeric
        description: ""

      - name: tolls_amount
        data_type: numeric
        description: ""

      - name: ehail_fee
        data_type: numeric
        description: ""

      - name: improvement_surcharge
        data_type: numeric
        description: ""

      - name: total_amount
        data_type: numeric
        description: ""

      - name: payment_type
        data_type: int64
        description: ""

      - name: payment_type_description
        data_type: string
        description: ""

  - name: fct_taxi_trips_quarterly_revenue
    description: >
      This model aggregates quarterly taxi trip revenues by extracting the year, quarter, 
      and month from the pickup_datetime field. It computes the total revenue per quarter 
      and calculates the Year-over-Year (YoY) revenue growth for each quarter.
    columns:
      - name: year
        description: "The year in which the taxi trips occurred."
        tests:
          - not_null
      - name: quarter
        description: "The quarter (1, 2, 3, or 4) in which the taxi trips occurred."
        tests:
          - not_null
      - name: quarterly_revenue
        description: "The aggregated total revenue for all taxi trips in the quarter."
        tests:
          - not_null
      - name: previous_year_revenue
        description: "The quarterly revenue for the same quarter in the previous year."
      - name: yoy_growth
        description: "The change in quarterly revenue compared to the same quarter in the previous year."
      - name: year_quarter
        description: "A derived dimension that concatenates the year and quarter (e.g., '2024/Q1')."

  - name: fct_taxi_trips_monthly_fare_p95
    description: >
      This model aggregates monthly taxi trip fares by extracting the year
      and month from the pickup_datetime field. It computes the percentile values of fares
      for each month.
    columns:
      - name: service_type
        description: "Service type (green, yellow)"
      - name: year
        description: ""
      - name: month
        description: ""
      - name: percentile90
        description: "Percentile value of fare_amount 90%"
      - name: percentile95
        description: "Percentile value of fare_amount 95%"
      - name: percentile97
        description: "Percentile value of fare_amount 97%"
  
  - name: dim_fhv_trips
    description: >
      Dimension table for For-Hire Vehicle (FHV) trips in New York City.
    columns:
      - name: dispatching_base_num
        description: The base number of the dispatching base.
      - name: pickup_datetime
        description: The date and time when the trip started.
      - name: dropoff_datetime
        description: The date and time when the trip ended.
      - name: pickup_locationid
        description: The location ID where the trip started.
      - name: pickup_zone
        description: The zone where the trip started.
      - name: dropoff_locationid
        description: The location ID where the trip ended.
      - name: dropoff_zone
        description: The zone where the trip ended.
      - name: year
        description: The year when the trip started.
      - name: month
        description: The month when the trip started.

  - name: fct_fhv_monthly_zone_traveltime_p90
    description: >
      Fact table for the 90th percentile of trip durations for For-Hire Vehicle (FHV) trips in New York City, partitioned by year, month, pickup location, and dropoff location.
    columns:
      - name: year
        description: The year when the trip started.
      - name: month
        description: The month when the trip started.
      - name: pickup_locationid
        description: The location ID where the trip started.
      - name: dropoff_locationid
        description: The location ID where the trip ended.
      - name: percentile90
        description: The 90th percentile of trip durations for the given partition.
